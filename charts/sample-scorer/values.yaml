global:
  # MCH supplies this from the BackplaneConfig target namespace.
  namespace: ""

hubconfig:
  # MCH supplies this from the hub's config.openshift.io/v1 Ingress named cluster.
  clusterIngressDomain: ""

dynamicScoringSampleScorer:
  namespace: dynamic-scoring-sample-scorer
  prometheusHost: https://prometheus-k8s.openshift-monitoring.svc.cluster.local:9091
  image:
    repository: quay.io/open-cluster-management/dynamic-scoring-sample-scorer
    tag: latest
    pullPolicy: Always
  # Use https only when the Route certificate is trusted by DSF's controller and agents.
  scheme: http
  # The static sample reads this file from the optional static-scorer-scores ConfigMap.
  staticScoresPath: /etc/static-scorer/scores.json
