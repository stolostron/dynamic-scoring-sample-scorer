apiVersion: dynamic-scoring.open-cluster-management.io/v1alpha1
kind: DynamicScorer
metadata:
  name: sample-scorer
  namespace: {{ required "global.namespace must be supplied by MCH" .Values.global.namespace }}
spec:
  description: A sample scorer for Prometheus CPU metrics
  configURL: "{{ .Values.sampleScorer.scheme }}://sample-scorer.{{ required "hubconfig.clusterIngressDomain must be supplied by MCH" .Values.hubconfig.clusterIngressDomain }}/config"
  configSyncMode: Full
  location: Internal
  scoreDestination: AddOnPlacementScore
  scoreDimensionFormat: "${scoreName}"
  source:
    # The host is deployment-specific and is used as a fallback because the
    # sample scorer omits it from /config unless PROMETHEUS_HOST is configured.
    host: https://prometheus-k8s.openshift-monitoring.svc.cluster.local:9091
    auth:
      tokenSecretRef:
        name: dynamic-scoring-agent-token
        key: token
