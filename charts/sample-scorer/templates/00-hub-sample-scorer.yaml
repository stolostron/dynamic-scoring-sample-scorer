apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sampleScorer.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-scorer
  namespace: {{ .Values.sampleScorer.namespace }}
  labels:
    app: sample-scorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-scorer
  template:
    metadata:
      labels:
        app: sample-scorer
    spec:
      containers:
        - name: sample-scorer
          image: "{{ .Values.sampleScorer.image.repository }}:{{ .Values.sampleScorer.image.tag }}"
          imagePullPolicy: {{ .Values.sampleScorer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: sample-scorer
  namespace: {{ .Values.sampleScorer.namespace }}
spec:
  selector:
    app: sample-scorer
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sample-scorer
  namespace: {{ .Values.sampleScorer.namespace }}
spec:
  host: "sample-scorer.{{ required "hubconfig.clusterIngressDomain must be supplied by MCH" .Values.hubconfig.clusterIngressDomain }}"
  to:
    kind: Service
    name: sample-scorer
  port:
    targetPort: http
{{ if eq .Values.sampleScorer.scheme "https" }}
  tls:
    termination: edge
{{ end }}
  wildcardPolicy: None
