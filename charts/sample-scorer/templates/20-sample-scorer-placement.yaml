apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: sample-scorer-spokes
  namespace: {{ .Values.sampleScorer.namespace }}
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            feature.open-cluster-management.io/addon-dynamic-scoring-framework: available
            vendor: OpenShift
          matchExpressions:
            - key: local-cluster
              operator: DoesNotExist
